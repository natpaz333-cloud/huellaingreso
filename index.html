<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Acceso Unifranz</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --paper: #F7F6F3;
    --ink: #1C1B19;
    --line: #D9D6CE;
    --accent: #F15A24;
    --accent-soft: #FCE8DE;
    --badge: #0A0A0A;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--paper);
    color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body{
    display:flex;
    flex-direction:column;
    min-height:100vh;
    align-items:center;
    justify-content:center;
    padding: 32px 20px;
    position: relative;
    overflow:hidden;
  }

  /* ---------- Shared frame ---------- */
  .frame{
    width:100%;
    max-width: 360px;
    display:flex;
    flex-direction:column;
    align-items:stretch;
  }
  .brand{
    display:flex;
    justify-content:center;
    margin-bottom: 28px;
  }
  .brand-badge{
    background: var(--badge);
    border-radius: 14px;
    padding: 16px 22px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .brand-badge img{
    width: 132px;
    height:auto;
    display:block;
  }
  .eyebrow{
    font-size:13px;
    letter-spacing:0.02em;
    color:#8B8778;
    margin-bottom:6px;
    text-align:center;
  }
  h1{
    font-size:22px;
    font-weight:600;
    margin:0 0 28px 0;
    letter-spacing:-0.01em;
    text-align:center;
  }

  /* ---------- Lock screen ---------- */
  #lockScreen{
    width:100%;
    max-width:360px;
    display:flex;
    flex-direction:column;
    align-items:center;
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  #lockScreen.hidden{
    display:none;
  }
  .lock-title{
    font-size:22px;
    font-weight:600;
    margin: 4px 0 6px 0;
    text-align:center;
  }
  .lock-sub{
    font-size:14px;
    color:#8B8778;
    text-align:center;
    margin-bottom:44px;
    line-height:1.5;
  }
  .fp-button{
    position:relative;
    width:104px;
    height:104px;
    border-radius:50%;
    border:2px solid var(--line);
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:0;
    transition: border-color 0.2s ease, transform 0.15s ease;
  }
  .fp-button:active{
    transform: scale(0.97);
  }
  .fp-button.scanning{
    border-color: var(--accent);
  }
  .fp-button.success{
    border-color: #3E7A4C;
  }
  .fp-ring{
    position:absolute;
    top:-2px; left:-2px; right:-2px; bottom:-2px;
    border-radius:50%;
    border:2px solid var(--accent);
    opacity:0;
    transform: scale(1);
  }
  .fp-button.scanning .fp-ring{
    animation: pulseRing 1.1s ease-out infinite;
  }
  @keyframes pulseRing{
    0%{ opacity:0.55; transform:scale(1); }
    100%{ opacity:0; transform:scale(1.35); }
  }
  .fp-icon{
    width:44px;
    height:44px;
    color: #6B6858;
    transition: color 0.2s ease;
  }
  .fp-button.scanning .fp-icon{
    color: var(--accent);
  }
  .fp-button.success .fp-icon{
    color: #3E7A4C;
  }
  .fp-status{
    margin-top:20px;
    font-size:13px;
    color:#8B8778;
    text-align:center;
    min-height:18px;
  }

  /* ---------- App screen ---------- */
  #appScreen{
    width:100%;
    max-width:360px;
    display:none;
    flex-direction:column;
    align-items:stretch;
    opacity:0;
    transform: translateY(6px);
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  #appScreen.visible{
    display:flex;
    opacity:1;
    transform: translateY(0);
  }

  .field{
    margin-bottom: 16px;
  }
  label{
    display:block;
    font-size:13px;
    color:#6B6858;
    margin-bottom:8px;
  }
  input{
    width:100%;
    font-size:17px;
    padding:14px 16px;
    border-radius:10px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    outline:none;
    transition: border-color 0.15s ease;
  }
  input:focus{
    border-color: var(--accent);
  }
  button.primary{
    margin-top:6px;
    width:100%;
    padding:14px 16px;
    font-size:16px;
    font-weight:600;
    border:none;
    border-radius:10px;
    background:var(--accent);
    color:#fff;
    cursor:pointer;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  button.primary:active{
    transform: scale(0.985);
  }
  button.primary:disabled{
    opacity:0.4;
    cursor:default;
  }
  .stage{
    margin-top:32px;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height: 1px;
  }
  .card{
    width:100%;
    background:#fff;
    border:1px solid var(--line);
    border-radius:16px;
    padding:28px 24px;
    display:flex;
    flex-direction:column;
    align-items:center;
    opacity:0;
    transform: translateY(6px);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .card.visible{
    opacity:1;
    transform: translateY(0);
  }
  #qrcode{
    padding:12px;
    background:#fff;
    border-radius:8px;
  }
  #qrcode img{
    display:block;
    border-radius:4px;
  }
  .code-label{
    margin-top:18px;
    font-size:13px;
    color:#8B8778;
  }
  .code-value{
    font-size:19px;
    font-weight:600;
    letter-spacing:0.02em;
    margin-top:2px;
  }
  .hint{
    margin-top:14px;
    font-size:12px;
    color:#A8A497;
    text-align:center;
    line-height:1.5;
  }
  .accent-rule{
    width:36px;
    height:3px;
    background:var(--accent);
    border-radius:2px;
    margin: 18px auto 0 auto;
  }
  .lock-again{
    margin-top:18px;
    text-align:center;
  }
  .lock-again button{
    background:none;
    border:none;
    color:#8B8778;
    font-size:13px;
    text-decoration:underline;
    cursor:pointer;
    padding:6px;
  }
</style>
</head>

  <div class="eyebrow">Acceso al campus</div>
  <h1>Genera tu código de acceso</h1>

  <div class="field">
    <label for="studentCode">Código de estudiante</label>
    <input type="text" id="studentCode" placeholder="Ej. A2023045912" autocomplete="off" autocapitalize="characters" />
  </div>

  <button id="generateBtn" class="primary" disabled>Generar QR</button>

  <div class="stage" id="stage"></div>

  <div class="lock-again">
    <button id="lockAgainBtn">Bloquear</button>
  </div>
</div>

<script>
  // ---------- Lock screen logic ----------
  const lockScreen = document.getElementById('lockScreen');
  const appScreen = document.getElementById('appScreen');
  const fpButton = document.getElementById('fpButton');
  const fpStatus = document.getElementById('fpStatus');
  const lockAgainBtn = document.getElementById('lockAgainBtn');

  let scanning = false;

  function tryWebAuthn(){
    return window.PublicKeyCredential !== undefined
      && typeof PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable === 'function';
  }

  async function authenticate(){
    if(scanning) return;
    scanning = true;
    fpButton.classList.add('scanning');
    fpStatus.textContent = 'Verificando huella…';

    // Simulated scan timing (device biometric hardware isn't reachable
    // from a web sandbox; wrap this app natively to call the real sensor).
    await new Promise(r => setTimeout(r, 900));

    fpButton.classList.remove('scanning');
    fpButton.classList.add('success');
    fpStatus.textContent = 'Identidad verificada';

    await new Promise(r => setTimeout(r, 450));

    unlockApp();
  }

  function unlockApp(){
    lockScreen.classList.add('hidden');
    appScreen.classList.add('visible');
  }

  function relock(){
    appScreen.classList.remove('visible');
    lockScreen.classList.remove('hidden');
    fpButton.classList.remove('success');
    fpStatus.textContent = 'Toca el sensor para continuar';
    scanning = false;
  }

  fpButton.addEventListener('click', authenticate);
  lockAgainBtn.addEventListener('click', relock);

  // ---------- QR generator logic ----------
  const input = document.getElementById('studentCode');
  const btn = document.getElementById('generateBtn');
  const stage = document.getElementById('stage');

  function updateButtonState(){
    btn.disabled = input.value.trim().length === 0;
  }

  input.addEventListener('input', updateButtonState);
  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !btn.disabled){
      generate();
    }
  });

  function generate(){
    const code = input.value.trim();
    if(!code) return;

    stage.innerHTML = '';

    const card = document.createElement('div');
    card.className = 'card';

    const qrHolder = document.createElement('div');
    qrHolder.id = 'qrcode';
    card.appendChild(qrHolder);

    const rule = document.createElement('div');
    rule.className = 'accent-rule';
    card.appendChild(rule);

    const label = document.createElement('div');
    label.className = 'code-label';
    label.textContent = 'Código';
    card.appendChild(label);

    const value = document.createElement('div');
    value.className = 'code-value';
    value.textContent = code;
    card.appendChild(value);

    const hint = document.createElement('div');
    hint.className = 'hint';
    hint.textContent = 'Muestra esta pantalla en el lector de acceso';
    card.appendChild(hint);

    stage.appendChild(card);

    new QRCode(qrHolder, {
      text: code,
      width: 220,
      height: 220,
      colorDark: "#1C1B19",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.M
    });

    requestAnimationFrame(() => {
      card.classList.add('visible');
    });
  }

  btn.addEventListener('click', generate);
  updateButtonState();
</script>
